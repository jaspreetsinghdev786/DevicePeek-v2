<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>DevicePeek</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="icons/icon48.png" width="30" height="30" alt="" />
      <div class="brand">
        <span class="title">DevicePeek</span>
        <span class="sub">Responsive preview</span>
      </div>
      <span class="status" id="status"><i class="dot" aria-hidden="true"></i><span id="statusText">…</span></span>
    </header>

    <div class="notice" id="notice" role="alert" hidden>
      <span class="notice-ico" data-icon="warning"></span>
      <p id="noticeText"></p>
    </div>

    <main>
      <button class="primary" id="toggle" type="button" disabled>
        <span class="primary-ico" data-icon="phone"></span>
        <span id="toggleText">Open preview</span>
        <kbd class="primary-kbd" id="toggleKbd" hidden></kbd>
      </button>

      <section class="card device" aria-label="Device">
        <div class="device-visual" aria-hidden="true"><div class="device-shape" id="shape"><div class="device-screen"></div></div></div>
        <div class="device-info">
          <label class="select">
            <span class="sr">Device</span>
            <select id="device"></select>
            <span class="caret" data-icon="chevron"></span>
          </label>
          <div class="specs" id="specs"></div>
          <div class="chips">
            <button class="chip" id="rotate" type="button" aria-pressed="false" title="Portrait / landscape">
              <span data-icon="rotate"></span><span id="rotateText">Portrait</span>
            </button>
            <button class="chip" id="frame" type="button" aria-pressed="true" title="Draw a device bezel around the preview">
              <span data-icon="frame"></span><span>Frame</span>
            </button>
          </div>
        </div>
      </section>

      <div class="field">
        <span class="label" id="layoutLabel">Layout</span>
        <div class="seg" role="radiogroup" aria-labelledby="layoutLabel">
          <button type="button" role="radio" id="modeSide" title="Docked on the right, the page reflows next to it"><span data-icon="dock"></span>Docked</button>
          <button type="button" role="radio" id="modeFloat" title="A movable, resizable window over the page"><span data-icon="float"></span>Floating</button>
        </div>
      </div>

      <div class="field">
        <span class="label" id="themeLabel">Theme</span>
        <div class="seg" role="radiogroup" aria-labelledby="themeLabel">
          <button type="button" role="radio" data-theme-value="light" title="Light"><span data-icon="sun"></span>Light</button>
          <button type="button" role="radio" data-theme-value="dark" title="Dark"><span data-icon="moon"></span>Dark</button>
          <button type="button" role="radio" data-theme-value="system" title="Follow your system setting"><span data-icon="system"></span>Auto</button>
        </div>
      </div>

      <div class="switches">
        <label class="switch">
          <span class="switch-ico" data-icon="follow"></span>
          <span class="switch-text"><b>Follow current page</b><small>Opens the page you navigate to</small></span>
          <input type="checkbox" id="follow" />
        </label>
        <label class="switch">
          <span class="switch-ico" data-icon="sync"></span>
          <span class="switch-text"><b>Sync scroll</b><small>Follows desktop scrolling</small></span>
          <input type="checkbox" id="sync" />
        </label>
        <label class="switch sub">
          <span class="switch-ico"></span>
          <span class="switch-text"><b>Two-way</b><small>Preview scrolls the desktop too</small></span>
          <input type="checkbox" id="twoway" />
        </label>
      </div>
    </main>

    <footer class="foot">
      <label class="check"><input type="checkbox" id="autoOpen" /> Open preview when I click the icon</label>
      <div class="shortcut">
        Shortcut <kbd id="shortcut">Alt+Shift+M</kbd>
        <a href="#" id="shortcutLink">Change</a>
      </div>
    </footer>

    <script src="lib/util.js"></script>
    <script src="lib/devices.js"></script>
    <script src="lib/prefs.js"></script>
    <script src="content/icons.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
