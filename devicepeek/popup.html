<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DevicePeek</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="icons/icon32.png" width="18" height="18" alt="" />
      <span class="title">DevicePeek</span>
      <span class="status" id="status">…</span>
    </header>

    <div class="notice" id="notice" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3.5l9 16H3z" /><path d="M12 10v4.5M12 17.5v.01" /></svg>
      <p id="noticeText"></p>
    </div>

    <main>
      <button class="primary" id="toggle" type="button" disabled>Open DevicePeek</button>

      <label class="field">
        <span class="label">Device</span>
        <span class="device-row">
          <select id="device" aria-label="Device"></select>
          <button class="icon" id="rotate" type="button" title="Rotate (portrait / landscape)" aria-label="Rotate" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2" /><path d="M3 12a9 9 0 0 1 4-7.5M21 12a9 9 0 0 1-4 7.5" /></svg>
          </button>
        </span>
      </label>

      <div class="field">
        <span class="label">Layout</span>
        <div class="seg" role="radiogroup" aria-label="Layout">
          <button type="button" role="radio" id="modeSide" title="Docked on the right, the page reflows next to it">Docked</button>
          <button type="button" role="radio" id="modeFloat" title="A movable, resizable window over the page">Floating</button>
        </div>
      </div>

      <div class="switches">
        <label class="switch">
          <span><b>Follow current page</b><small>Preview opens the page you navigate to</small></span>
          <input type="checkbox" id="follow" />
        </label>
        <label class="switch">
          <span><b>Sync scroll</b><small>Desktop scrolling moves the preview</small></span>
          <input type="checkbox" id="sync" />
        </label>
        <label class="switch sub">
          <span><b>Two-way</b><small>Preview scrolling moves the desktop too</small></span>
          <input type="checkbox" id="twoway" />
        </label>
      </div>
    </main>

    <footer class="foot">
      <label class="check"><input type="checkbox" id="autoOpen" /> Open preview when I click the icon</label>
      <div class="shortcut">
        Shortcut <kbd id="shortcut">Alt+Shift+M</kbd>
        <a href="#" id="shortcutLink">Change</a>
      </div>
    </footer>

    <script src="lib/util.js"></script>
    <script src="lib/devices.js"></script>
    <script src="lib/prefs.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
